spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: food-delivery marketplace

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mongodb:
    uri: mongodb://admin:Mirsaid15@localhost:27017/food_delivery?authSource=admin
  data:
    redis:
      host: localhost
      port: 6379

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:false}
    change-log: classpath:db/changelog/changelog-master.yml
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ha0gifBX5HlfIndkuD8ysLvB8QAVwBPKe9jMibjsB1o
  expiration: 360000
