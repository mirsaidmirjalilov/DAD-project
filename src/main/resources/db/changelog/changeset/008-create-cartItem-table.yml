databaseChangeLog:
  - changeSet:
      id: create-cart-item
      author: team
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: cart_id
                  type: BIGINT

                  constraints:
                    nullable: false
                    foreignKeyName: fk_cart_item_cart
                    references: carts(id)

              - column:
                  name: menu_items_id
                  type: BIGINT

                  constraints:
                    nullable: false
                    foreignKeyName: fk_cart_item_menu_item
                    references: menu_items(id)

              - column:
                  name: quantity
                  type: INT

                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(19,2)

                  constraints:
                    nullable: false