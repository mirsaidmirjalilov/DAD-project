databaseChangeLog:
  - changeSet:
      id: create-carts
      author: team
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT

                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_cart_user
                    references: users(id)

              - column:
                  name: total_price
                  type: DECIMAL(19,2)

                  constraints:
                    nullable: false