databaseChangeLog:
  - changeSet:
      id: create-menu-items-table
      author: team
      changes:
        - createTable:
            tableName: menu_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: price
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: available
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: restaurant_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false

  - changeSet:
      id: add-menu-items
      author: team
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: restaurant_id
            baseTableName: menu_items
            constraintName: fk_menu_items_restaurant
            referencedColumnNames: id
            referencedTableName: restaurants