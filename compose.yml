services:
  db:
    image: postgres:latest
    container_name: food-delivery-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mirsaid15
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-delivery-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/food_delivery_db
        - SPRING_DATASOURCE_USERNAME=postgres
        - SPRING_DATASOURCE_PASSWORD=Mirsaid15
        - SPRING_LIQUIBASE_ENABLED=true
        - SPRING_LIQUIBASE_CHANGELOG=classpath:db.changelog/db.chengelog-master.yaml